<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- חוסם כל תקשורת החוצה: האפליקציה טוענת ומדברת רק עם הקבצים של עצמה -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; form-action 'none'; base-uri 'self'">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="תזרים">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <title>תזרים</title>
</head>
<body>
  <header class="topbar"><h1 id="title">סיכום</h1></header>

  <main id="view"></main>

  <nav class="tabbar" aria-label="ניווט ראשי">
    <a href="#summary" data-tab="summary">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h13V9.5"/></svg>
      <span>סיכום</span>
    </a>
    <a href="#forecast" data-tab="forecast">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M4 16l5-5 4 3 7-8"/></svg>
      <span>תחזית</span>
    </a>
    <a href="#data" data-tab="data">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>נתונים</span>
    </a>
    <a href="#backup" data-tab="backup">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>
      <span>גיבוי</span>
    </a>
  </nav>

  <dialog id="sheet" aria-label="פירוט">
    <div class="sheet-head"><button type="button" class="icon-btn" data-action="close-sheet" aria-label="סגירה">✕</button></div>
    <div id="sheet-body"></div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" hidden>

  <script src="js/calc.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
